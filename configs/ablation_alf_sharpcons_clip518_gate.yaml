# Exp: ALF sharpness-consistency + reliability gate (consistency gate)

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  l2_normalize_image_features: true
  msm_cdist_chunk_size: 16
  use_hier_fusion: false

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness_consistency"
    consistency_score_mix: 0.5
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: true
    consistency_method: "topk_overlap"
    consistency_topk_ratio: 0.01
    consistency_tau: 0.5
    consistency_beta: 10.0
    consistency_gate_hard_floor: 0.0

    calibration_enabled: false
    patch_gate_enabled: false

  adaptive_r_fusion:
    enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_ablation_alf_sharpcons_clip518_gate"
  vis: false
  vis_type: single_norm
  save_excel: true
