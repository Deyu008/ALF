datasets:
  dataset_name: 'mvtec_ad'  # choice ['mvtec_ad', 'visa']
  data_path: ./data/mvtec_anomaly_detection/
  class_name: 'screw'
  img_resize: 518
  divide_num: 1
models:
  backbone_name: 'dinov3_vitl16'
  pretrained: 'facebook'
  batch_size: 4
  # Align with trainfree branch: stabilize RsCIN / similarity scale for DINO features.
  l2_normalize_image_features: true
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
  use_hier_fusion: False
  hier_fusion:
    temperature: 0.7
    top_p: 0.9
    lambda_patch: 0.3
    patch_mode: 'mult'
    gamma_img: 0.2
    cls_topk_ratio: 0.3
    adaptive:
      enabled: false
      neff_floor: 1.5
      neff_ceil: 4.0
      lambda_min_scale: 0.3
      lambda_max_scale: 1.0
      log_stats: true
      top_p_enabled: false
      top_p_min: 0.8
      top_p_max: 0.98
      temperature_enabled: false
      temperature_min: 0.6
      temperature_max: 1.2
device: 1
testing:
  output_dir: 'output_hf'
  vis: True
  vis_type: single_norm # choice ['single_norm', 'whole_norm']
  save_excel: True

