# Exp: Inductive Normal Bank with capped k_max (absolute) on CLIP@518 (core-e01)

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Keep computational knobs identical between ablations.
  l2_normalize_image_features: true
  msm_cdist_chunk_size: 16
  use_hier_fusion: false

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness_consistency"
    consistency_score_mix: 0.5
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: false
    calibration_enabled: false
    patch_gate_enabled: false

  adaptive_r_fusion:
    enabled: false

inductive_bank:
  enabled: true
  split: train
  only_normal: true
  max_images: -1
  query_chunk_size: 1
  # MSM interval mean params: allow absolute k to avoid overly large top-k when bank is big.
  msm_topmin_min: 0
  msm_topmin_max: 64

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_ablation_alf_sharpcons_clip518_inductive_bank_kmax64"
  vis: false
  vis_type: single_norm
  save_excel: true
