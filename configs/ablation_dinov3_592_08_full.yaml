# Ablation (8/8): FULL modules ON (ALF + AMSF + Gate + PatchGate + Calibration + Transductive).

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 592
  divide_num: 1

models:
  backbone_name: "dinov3_vitl16"
  pretrained: "facebook"
  batch_size: 4
  l2_normalize_image_features: true
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
  msm_cdist_chunk_size: 16

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: true
    consistency_method: "topk_overlap"
    consistency_topk_ratio: 0.01
    consistency_tau: 0.5
    consistency_beta: 10.0

    calibration_enabled: false

  adaptive_r_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.1
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1

    consistency_gate_enabled: true
    consistency_method: "topk_overlap"
    consistency_topk_ratio: 0.01
    consistency_tau: 0.5
    consistency_beta: 10.0

    calibration_enabled: true
    calibration_method: "mean_std"
    calibration_consistency_threshold: 0.15
    calibration_quantiles: [0.1, 0.9]

    patch_gate_enabled: true
    patch_gate_method: "adjacent_agreement"
    patch_gate_tau: 0.3
    patch_gate_beta: 10.0
    patch_gate_floor: 0.1
    patch_gate_smooth_kernel: 0
    patch_gate_protect_quantile: 0.99
    patch_gate_gate_threshold: 0.2

    log_weights: true

device: 0

transductive:
  enabled: true
  num_passes: 2

  bank_ratio_mode: "adaptive_knee"
  bank_ratio: 0.4
  bank_ratio_min: 0.2
  bank_ratio_max: 0.7
  knee_strength_min: 0.03
  knee_tail_frac: 0.85

  bank_filter: true
  retrieval_topk: 16
  score_pool: "q99"

  msm_topmin_min: 0.0
  msm_topmin_max: 0.3

  safe_fusion: true
  adaptive_gate: true
  gate_threshold: 0.19

  apply_to_pixel: true

testing:
  output_dir: "output/ablation_dinov3_592_08_full"
  vis: false
  vis_type: single_norm
  save_excel: true

