# Exp: ALF sharpness-consistency with adaptive shrink + drift-triggered calibration on CLIP@518

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Keep computational knobs identical between ablations.
  l2_normalize_image_features: true
  msm_cdist_chunk_size: 16
  use_hier_fusion: false

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness_consistency"
    consistency_score_mix: 0.5
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.0
    shrink_to_uniform_adaptive: true  # confidence-based shrink to uniform
    shrink_to_uniform_min: 0.05       # min shrink when confidence is high
    shrink_to_uniform_max: 0.20       # max shrink when confidence is low
    shrink_to_uniform_metric: "margin"
    shrink_to_uniform_margin_low: 0.05
    shrink_to_uniform_margin_high: 0.20
    calibration_enabled: true
    calibration_method: "bg_mean_std"
    calibration_bg_percentile: 0.9
    calibration_drift_threshold: 0.10  # only calibrate when drift exceeds threshold
    log_weights: true

    consistency_gate_enabled: false
    patch_gate_enabled: false

  adaptive_r_fusion:
    enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_ablation_alf_sharpcons_clip518_shrink_adaptive_calib_drift"
  vis: false
  vis_type: single_norm
  save_excel: true
