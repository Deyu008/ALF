# Ablation (0/8): DINOv3@592 baseline, modules OFF.

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 592
  divide_num: 1

models:
  backbone_name: "dinov3_vitl16"
  pretrained: "facebook"
  batch_size: 4
  l2_normalize_image_features: true
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
  msm_cdist_chunk_size: 16

  adaptive_layer_fusion:
    enabled: false
  adaptive_r_fusion:
    enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/ablation_dinov3_592_00_off"
  vis: false
  vis_type: single_norm
  save_excel: true

