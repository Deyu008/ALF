# Adaptive Multi-Scale Fusion (AMSF) configuration
# This config enables sharpness-based weighting and optional calibration

datasets:
  dataset_name: "mvtec_ad" # choice ['mvtec_ad', 'visa', 'btad']
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Adaptive R Fusion (AMSF) settings - v2 with calibration
  adaptive_r_fusion:
    enabled: true
    weighting_method: "sharpness" # 'sharpness' | 'contrast' | 'gradient' | 'entropy' | 'kurtosis' | 'consistency'
    temperature: 0.2 # lower temperature = sharper discrimination
    weight_floor: 0.1 # allow more weight variation
    weight_ceil: 0.7
    saliency_percentile: 95.0 # top 5% for peak detection
    calibration_enabled: true
    calibration_method: "mean_std" # 'mean_std' | 'quantile'
    calibration_quantiles: [0.1, 0.9]
    shrink_to_uniform: 0.1 # 0 disables
    log_weights: true

device: 1

testing:
  output_dir: "output_amsf"
  vis: False
  vis_type: single_norm
  save_excel: True
