# Experiment matrix (B-core): CLIP@518 + modules ON (core = ALF + AMSF only)
#
# Core ON definition:
# - Enable ALF (adaptive_layer_fusion) and AMSF (adaptive_r_fusion)
# - Disable Consistency Gate / Calibration / PatchGate / Transductive refinement
#
# Dataset fields (`dataset_name`, `data_path`) are typically overridden by runner scripts.

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Optional: reduce peak memory in MSM (exact computation, chunked cdist)
  msm_cdist_chunk_size: 16

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: false
    calibration_enabled: false
    patch_gate_enabled: false

  adaptive_r_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.1
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: false
    calibration_enabled: false
    patch_gate_enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_matrix_clip518_on_core_e03"
  vis: false
  vis_type: single_norm
  save_excel: true

