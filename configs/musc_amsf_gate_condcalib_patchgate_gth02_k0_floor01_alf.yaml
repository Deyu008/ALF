# Best-known settings (PatchGate gth=0.2, k=0, floor=0.1) + AMSF gate+CondCalib + ALF
#
# Baseline backbone/settings:
# - CLIP ViT-L-14-336 (openai)
# - img_resize=518, batch_size=4
#
# Enabled modules:
# - Adaptive Layer Fusion (ALF): fuse MSM maps across backbone layers
# - Adaptive R Fusion (AMSF): fuse across r values
# - Consistency-gated residual fusion + conditional calibration
# - Patch-wise residual gate (PatchGate)

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 518
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Optional: reduce peak memory in MSM (exact computation, chunked cdist)
  msm_cdist_chunk_size: 16

  # Adaptive Layer Fusion (ALF): fuse MSM maps across backbone layers
  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: true
    consistency_method: "topk_overlap"
    consistency_topk_ratio: 0.01
    consistency_tau: 0.5
    consistency_beta: 10.0

    # Keep calibration off for ALF (r-level condcalib already handles drift).
    calibration_enabled: false
    calibration_method: "mean_std"
    calibration_consistency_threshold: -1.0

  # Adaptive R Fusion (AMSF): fuse across r values
  adaptive_r_fusion:
    enabled: true
    weighting_method: "sharpness"
    temperature: 0.2
    weight_floor: 0.1
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1

    # Consistency-gated residual fusion
    consistency_gate_enabled: true
    consistency_method: "topk_overlap"
    consistency_topk_ratio: 0.01
    consistency_tau: 0.5
    consistency_beta: 10.0

    # Conditional calibration: only when consistency < threshold (low confidence)
    calibration_enabled: true
    calibration_method: "mean_std"
    calibration_consistency_threshold: 0.15
    calibration_quantiles: [0.1, 0.9]

    # Patch-wise residual gate (PatchGate)
    patch_gate_enabled: true
    patch_gate_method: "adjacent_agreement"
    patch_gate_tau: 0.3
    patch_gate_beta: 10.0
    patch_gate_floor: 0.1
    patch_gate_smooth_kernel: 0
    patch_gate_protect_quantile: 0.99
    patch_gate_gate_threshold: 0.2

    log_weights: true

device: 1

testing:
  # Put a date in the root to make runs easy to compare
  output_dir: "output/20260105_baseline_best_all_on"
  vis: False
  vis_type: single_norm
  save_excel: True
