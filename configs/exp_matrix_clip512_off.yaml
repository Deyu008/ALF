# Experiment matrix (A): CLIP@512 + modules OFF (baseline)
#
# Notes:
# - Metrics are computed in `utils/metrics.py` (F1 uses best threshold on PR curve).
# - Dataset fields (`dataset_name`, `data_path`) are typically overridden by the runner script.

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 512
  divide_num: 1

models:
  backbone_name: "ViT-L-14-336"
  pretrained: "openai"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # All optional modules disabled (baseline).
  use_hier_fusion: false
  adaptive_r_fusion:
    enabled: false
  adaptive_layer_fusion:
    enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_matrix_clip512_off"
  vis: false
  vis_type: single_norm
  save_excel: true

