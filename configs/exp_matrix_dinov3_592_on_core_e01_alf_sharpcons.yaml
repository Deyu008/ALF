# Experiment matrix (D-core-e01): DINOv3@592 + ALF with sharpness-consistency weights
#
# This keeps the Protocol-B core-e01 scope (ALF only) but uses a hybrid
# sharpness*consistency score to downweight noisy layers while preserving
# localized anomaly sensitivity.

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 592
  divide_num: 1

models:
  backbone_name: "dinov3_vitl16"
  pretrained: "facebook"
  batch_size: 4
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]

  # Keep computational knobs identical between OFF/ON configs.
  l2_normalize_image_features: true
  msm_cdist_chunk_size: 16
  use_hier_fusion: false

  adaptive_layer_fusion:
    enabled: true
    weighting_method: "sharpness_consistency"
    consistency_score_mix: 0.5
    temperature: 0.2
    weight_floor: 0.02
    weight_ceil: 0.7
    saliency_percentile: 95.0
    shrink_to_uniform: 0.1
    log_weights: true

    consistency_gate_enabled: false
    calibration_enabled: false
    patch_gate_enabled: false

  adaptive_r_fusion:
    enabled: false

device: 0

transductive:
  enabled: false

testing:
  output_dir: "output/exp_matrix_dinov3_592_on_core_e01_alf_sharpcons"
  vis: false
  vis_type: single_norm
  save_excel: true
