# Ablation (7/8): +Transductive refinement only, with modules OFF (ALF/AMSF disabled).

datasets:
  dataset_name: "mvtec_ad"
  data_path: ./data/mvtec_anomaly_detection/
  class_name: "ALL"
  img_resize: 592
  divide_num: 1

models:
  backbone_name: "dinov3_vitl16"
  pretrained: "facebook"
  batch_size: 4
  l2_normalize_image_features: true
  feature_layers: [5, 11, 17, 23]
  r_list: [1, 3, 5]
  msm_cdist_chunk_size: 16

  adaptive_layer_fusion:
    enabled: false
  adaptive_r_fusion:
    enabled: false

device: 0

transductive:
  enabled: true
  num_passes: 2

  bank_ratio_mode: "adaptive_knee"
  bank_ratio: 0.4
  bank_ratio_min: 0.2
  bank_ratio_max: 0.7
  knee_strength_min: 0.03
  knee_tail_frac: 0.85

  bank_filter: true
  retrieval_topk: 16
  score_pool: "q99"

  msm_topmin_min: 0.0
  msm_topmin_max: 0.3

  safe_fusion: true
  adaptive_gate: true
  gate_threshold: 0.19

  apply_to_pixel: true

testing:
  output_dir: "output/ablation_dinov3_592_07_transductive_only"
  vis: false
  vis_type: single_norm
  save_excel: true

